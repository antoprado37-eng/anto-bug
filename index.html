<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ANTO BUG · Creador de salas</title>
<style>
:root{color-scheme:dark;--bg:#090b16;--card:#161a2d;--edge:#333b5c;--fg:#f5f4ff;--muted:#adb0ce;--pink:#ff5fbb;--mint:#4be6bf}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{width:min(100%,540px);margin:auto;padding:20px 18px}
.panel{padding:18px;background:rgba(22,26,45,.96);border:1px solid var(--edge);border-radius:19px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:11px;padding:6px 9px;border-radius:999px;font-weight:800;background:#2e314e;color:#ddd8ff}
.status{padding:12px;background:#0e1429;border:1px solid #303a5b;border-radius:12px;margin:12px 0;font-size:13px}
.primary{background:linear-gradient(100deg,#ff69b3,#cc74ff);border:0;color:#171225;font-weight:850;border-radius:12px;padding:14px;width:100%}
.selectors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.select-wrap{display:grid;gap:5px}select{background:#11182d;color:white;border:1px solid var(--edge);border-radius:10px;padding:10px}
.list{display:grid;gap:9px;margin-top:12px}.item{border-radius:12px;border:1px solid #39415f;background:#202640;padding:12px}
.code{font-size:23px;font-weight:900;letter-spacing:.09em}.empty{text-align:center;padding:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
 <header style="margin-bottom:20px;font-weight:900">✦ ANTO BUG</header>
 <section class="panel">
  <div class="row"><h2>⚙️ Configurar Sala Bug</h2><span id="livePill" class="pill">LISTO</span></div>
  <div class="selectors">
   <div class="select-wrap"><label>Impostores</label><select id="selectImpostores"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div>
   <div class="select-wrap"><label>Velocidad</label><select id="selectVelocidad"><option value="1.0">x1.0</option><option value="1.5" selected>x1.5</option><option value="3.0">x3.0</option></select></div>
  </div>
  <div id="status" class="status">Presiona «Crear Nueva Sala» para generar el código de acceso.</div>
  <button id="fetchButton" class="primary" type="button">🚀 Crear Nueva Sala</button>
 </section>
 <section class="panel">
  <div class="row"><h2>🟢 Códigos Generados</h2></div>
  <div id="codes" class="list"><div class="empty">Los códigos aparecerán aquí.</div></div>
 </section>
</div>
<script>
(()=>{"use strict";
let allCodes=[];
function crearSala(){
 const imp=document.getElementById("selectImpostores").value;
 const vel=document.getElementById("selectVelocidad").value;
 const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 let codigo="";
 for(let i=0;i<6;i++){
  codigo+=letras.charAt(Math.floor(Math.random()*letras.length));
 }
 allCodes.unshift({code:codigo,imp:imp,vel:vel});
 document.getElementById("status").textContent="¡Sala creada con éxito!";
 const box=document.getElementById("codes");
 box.replaceChildren();
 allCodes.forEach(x=>{
  const item=document.createElement("div");item.className="item";
  item.innerHTML=`<div class="code">${x.code}</div><div style="font-size:11px;color:#abb3ce">Impostores: ${x.imp} · Velocidad: x${x.vel} · Sala lista en Among Us</div>`;
  box.append(item);
 });
}
document.getElementById("fetchButton").addEventListener("click",crearSala);
})();
</script>
</body>
</html>
